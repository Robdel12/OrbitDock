name: Update Sparkle Appcast

on:
  release:
    types:
      - published
      - edited
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example: v0.4.0). Leave empty to use latest release."
        required: false
        type: string

permissions:
  contents: write

jobs:
  appcast:
    runs-on: macos-15
    env:
      SPARKLE_VERSION: "2.9.0"

    steps:
      - name: Resolve release and select archive
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_URL: ${{ github.event.release.url }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "release" ] && [ -n "${EVENT_RELEASE_URL:-}" ]; then
            release_json="$(gh api "$EVENT_RELEASE_URL")"
          elif [ -n "${INPUT_RELEASE_TAG:-}" ]; then
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$INPUT_RELEASE_TAG")"
          else
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")"
          fi

          tag_name="$(echo "$release_json" | jq -r '.tag_name')"
          archive_name="$(
            echo "$release_json" \
              | jq -r '
                .assets
                | map(select(.name | endswith(".zip") and (.name | startswith("OrbitDock-"))))
                | sort_by(.updated_at)
                | last
                | .name // empty
              '
          )"

          if [ -z "$archive_name" ]; then
            echo "No OrbitDock .zip release asset found."
            echo "Upload your signed app zip first, then rerun this workflow."
            exit 1
          fi

          mkdir -p artifacts
          gh release download "$tag_name" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive_name" \
            --dir artifacts

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"

      - name: Install Sparkle tools
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          tar -xJf sparkle.tar.xz
          generate_appcast_path="$(find . -type f -path '*/bin/generate_appcast' | head -n 1)"
          if [ -z "$generate_appcast_path" ]; then
            echo "Could not find generate_appcast in Sparkle distribution."
            exit 1
          fi
          chmod +x "$generate_appcast_path"
          echo "GENERATE_APPCAST=$generate_appcast_path" >> "$GITHUB_ENV"

      - name: Generate release notes
        env:
          TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          notes_path="artifacts/OrbitDock-${version}.md"
          {
            printf '# OrbitDock %s\n\n' "$version"
            if [ -n "${RELEASE_BODY:-}" ]; then
              printf '%s\n' "$RELEASE_BODY"
            else
              printf 'See the GitHub release for details.\n'
            fi
          } > "$notes_path"

      - name: Generate appcast.xml
        env:
          TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
          ARCHIVE_NAME: ${{ steps.resolve.outputs.archive_name }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SPARKLE_PRIVATE_ED_KEY:-}" ]; then
            echo "Missing SPARKLE_PRIVATE_ED_KEY secret."
            exit 1
          fi

          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" > sparkle_private_key
          chmod 600 sparkle_private_key

          "$GENERATE_APPCAST" \
            --ed-key-file sparkle_private_key \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/" \
            --embed-release-notes \
            artifacts

          if [ ! -f artifacts/appcast.xml ]; then
            echo "generate_appcast did not produce artifacts/appcast.xml"
            exit 1
          fi

      - name: Upload appcast.xml to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" artifacts/appcast.xml --clobber --repo "$GITHUB_REPOSITORY"
